ObserverPipelines:
  name: MainObserverPipeline
  gui: true
  observers:
    - type: Encoder

    - type: MCKineticsObserver
      update: true
      config:  
        withDebugLogs: true
        leggedOdometry:
          odometryType: 6D 	

    - type: Tilt
      update: false 
    
    - type: MCWaiko
      update: false 
      config: 
        leggedOdometry:
          odometryType: None 	
 
    - type: MCValinor
      update: false 

    - type: Attitude
      update: true
      
    - type: KinematicInertial
      update: true
      config:
        anchorFrame:
          maxAnchorFrameDiscontinuity: 0.05 # [m]