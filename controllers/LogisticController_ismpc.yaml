ObserverPipelines:
  name: MainObserverPipeline
  gui: false
  observers:
    - type: Encoder
    
    - type: BodySensor
      update: true
      config:
        bodySensor: FloatingBase
        
    - type: Attitude
      update: true

      
    # - type: KinematicInertial
