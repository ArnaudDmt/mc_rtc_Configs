ObserverPipelines:
  name: MainObserverPipeline
  gui: false
  observers:
    - type: Encoder
    
    - type: BodySensor
      update: false
      config:
        bodySensor: FloatingBase
        
    - type: Attitude
      update: true

      
    - type: KinematicInertial
      update: true
      config:
        anchorFrame:
          maxAnchorFrameDiscontinuity: 0.05 # [m]

    # - type: MCVanytEstimator
    #   update: true      
    #   config: 
    #     leggedOdometry:
    #       odometryType: 6D


    - type: MCKineticsObserver
      update: false 
      config: 
        withGui: true
        ignoreWrenchSensors: false
        withContactStateCovRemoval: false
        withDebugLogs: true
        leggedOdometry:
          odometryType: None